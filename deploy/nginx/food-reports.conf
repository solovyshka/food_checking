server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Static food reports: /r/<token>.html
    location /r/ {
        alias /opt/food_checking/var/reports/;
        default_type text/html;
        charset utf-8;
        autoindex off;
        add_header X-Content-Type-Options nosniff;
        add_header Cache-Control "private, max-age=300";
    }

    location = / {
        return 204;
    }

    location / {
        return 404;
    }
}
