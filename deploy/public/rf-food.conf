# Include inside the existing HTTPS server for vladislavsolovei.ru.
location = /food-consumption { return 302 /food-consumption/app/; }
location = /food-consumption/ { return 302 /food-consumption/app/; }
location = /food-consumption/app/version.json {
    alias /var/www/food-consumption-app/version.json;
    default_type application/json;
    etag off;
    if_modified_since off;
    add_header Cache-Control "no-store";
}
location = /food-consumption/app/update.bin {
    alias /var/www/food-consumption-app/food_consumption.apk;
    default_type application/octet-stream;
    add_header Cache-Control "no-store";
    add_header Accept-Ranges bytes;
}
location /food-consumption/app/ {
    alias /var/www/food-consumption-app/;
    index index.html;
    autoindex off;
    gzip off;
    types { text/html html; application/json json; }
    default_type application/octet-stream;
    add_header Cache-Control "no-store";
}
location /food-consumption/api/mobile/ {
    proxy_pass http://127.0.0.1:18092/api/mobile/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    client_max_body_size 21m;
    proxy_request_buffering on;
    proxy_buffering off;
    proxy_read_timeout 700s;
    proxy_send_timeout 700s;
    add_header Cache-Control "no-store";
}
