# OVH's existing public :443 SNI switch sends this hostname to :8443.
server {
    listen 127.0.0.1:8443 ssl;
    http2 on;
    server_name food-consumption.solovyshka.com;
    port_in_redirect off;
    ssl_certificate /etc/letsencrypt/live/food-consumption.solovyshka.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/food-consumption.solovyshka.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    location = / { return 302 /app/; }
    location = /app/version.json {
        alias /var/www/food-consumption-app/version.json;
        default_type application/json;
        etag off;
        if_modified_since off;
        add_header Cache-Control "no-store";
    }
    location = /app/update.bin {
        alias /var/www/food-consumption-app/food_consumption.apk;
        default_type application/octet-stream;
        add_header Cache-Control "no-store";
        add_header Accept-Ranges bytes;
    }
    location /app/ {
        alias /var/www/food-consumption-app/;
        index index.html;
        autoindex off;
        gzip off;
        types { text/html html; application/json json; }
        default_type application/octet-stream;
        add_header Cache-Control "no-store";
    }
    # Expiring links live on OVH; neither route reaches the box's reverse tunnel.
    location /media/food/ {
        proxy_pass http://127.0.0.1:8093;
        proxy_set_header Connection "";
        access_log off;
        proxy_buffering off;
    }
    location = /internal/food-media/upload {
        proxy_pass http://127.0.0.1:8093;
        proxy_set_header Connection "";
        client_max_body_size 4m;
        proxy_read_timeout 60s;
        access_log off;
    }
    location /api/mobile/ {
        proxy_pass http://127.0.0.1:18092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        client_max_body_size 21m;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_read_timeout 700s;
        proxy_send_timeout 700s;
        add_header Cache-Control "no-store";
    }
}
